spring:
  application:
    name: tsdms

  # Nạp secret local (app password Gmail...) từ file KHÔNG commit lên git.
  # optional: -> thiếu file cũng không sao (CI/thành viên khác chạy vẫn bình thường).
  # Đặt MAIL_USERNAME/MAIL_PASSWORD trong file này 1 lần -> khỏi set env mỗi phiên.
  config:
    import: optional:classpath:mail-local.properties

  datasource:
    # URL qua biến môi trường để deploy trỏ sang DB thật (Azure SQL...) mà không sửa code.
    # Default = SQL Server local -> máy dev chạy y như cũ, không cần đặt DB_URL.
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=TSDMS;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      # Flyway quản lý schema -> Hibernate không tự tạo/sửa bảng
      ddl-auto: none
      naming:
        # Giữ NGUYÊN tên bảng/cột trong @Table/@Column (PascalCase khớp SQL Server).
        # Mặc định Spring đổi sang snake_case -> sẽ sai với schema hiện tại.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        # KHÔNG khai dialect tường minh: Hibernate 7 tự chọn SQLServerDialect từ JDBC
        # metadata; khai thừa sẽ bị cảnh báo deprecation HHH90000025.
        format_sql: true
        type:
          # Hibernate 6+ mặc định map Instant -> DATETIMEOFFSET, nhưng quy ước schema (V1)
          # là "DATETIME2 lưu giờ UTC" -> ép về TIMESTAMP (datetime2) cho khớp cột thật.
          # Thiếu dòng này Hibernate validate sẽ đỏ toàn bộ cột CreatedAt/UpdatedAt/DeletedAt...
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          # Đi kèm dòng trên: bind Instant theo UTC (không theo múi giờ JVM +07) — để giá trị
          # ghi xuống datetime2 đúng quy ước UTC, khớp DEFAULT SYSUTCDATETIME() của DB.
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Baseline ở version 1: Flyway BỎ QUA V1 (dữ liệu nền đã có sẵn) nhưng VẪN CHẠY V2
    # (tạo bảng Lesson — V2 có IF OBJECT_ID nên an toàn dù bảng đã tồn tại) + V3, V4.
    # (Trước đặt nhầm =2 khiến Flyway bỏ qua V2 → thiếu bảng Lesson.)
    # DB rỗng (máy mới): baseline không kích hoạt → chạy đủ V1→V4.
    baseline-version: 1

  # Giới hạn upload file — PHẢI khai rõ, nếu không Spring Boot dùng mặc định
  # max-file-size=1MB/max-request-size=10MB. File giáo án (PDF báo cáo, ảnh scan...)
  # thường lớn hơn 1MB -> bị Tomcat/Spring cắt request giữa chừng, FE không nhận được
  # response JSON (chỉ thấy network error) thay vì thông báo lỗi rõ ràng.
  # Khớp với MAX_UPLOAD_FILE_SIZE_BYTES trong LessonService.java.
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB # nhỉnh hơn max-file-size vì có thể upload nhiều file 1 lần

  # Gửi email (luồng quên mật khẩu). Điền tài khoản Gmail + App Password qua biến môi trường.
  # Tạo App Password: Google Account -> Security -> 2-Step Verification -> App passwords.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ===== Cấu hình riêng của TSDMS (bind qua @ConfigurationProperties) =====
tsdms:
  jwt:
    # QUAN TRỌNG: đổi secret ở môi trường thật. Tối thiểu 32 byte cho HS256.
    secret: ${JWT_SECRET:tsdms-dev-secret-change-me-please-at-least-32-bytes-long-0123456789}
    access-token-ttl: 15m # access token sống ngắn
    refresh-token-ttl: 7d # refresh token sống dài, lưu hash ở DB để thu hồi được
    issuer: tsdms
  cors:
    # Danh sách origin FE được phép gọi API, phân tách bằng dấu phẩy (deploy: thêm domain
    # Vercel, vd "https://kdc-eduops.vercel.app"). Default = vite dev để local chạy như cũ.
    # Sai origin ở production = mọi API dính 403 "Invalid CORS request" (kể cả login).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  reset:
    token-ttl: 30m # link đặt lại mật khẩu hết hạn sau 30 phút
    base-url: ${APP_BASE_URL:http://localhost:5173} # FE base url để ghép link reset
  rate-limit:
    enabled: true
    capacity: 5 # tối đa 5 lần thử dồn dập / IP / endpoint (login, forgot/reset-password)
    refill-period: 1m # hồi đầy lại sau 1 phút → ~5 request/phút/IP
    # CHỈ bật true khi deploy sau reverse-proxy tin cậy (nginx) có gắn X-Forwarded-For.
    # Để false, client tự gửi header này sẽ KHÔNG né được rate limit (chống giả mạo IP).
    trust-forwarded-header: false
  mail:
    # Địa chỉ hiển thị người gửi. Gmail chỉ cho gửi dưới danh nghĩa chính tài khoản đã xác thực,
    # nên phần email trong <...> phải khớp MAIL_USERNAME. Đổi qua env khi dùng tài khoản khác.
    from: ${MAIL_FROM:KDC EduOps <kdceduopsai@gmail.com>}
    # Gửi mail hỏng thì có in link đặt lại mật khẩu ra log không. Link chứa TOKEN CÒN SỐNG
    # -> ai đọc được log là đổi được mật khẩu người đó. Chỉ bật tạm trên máy chưa cấu hình SMTP.
    log-reset-link: ${MAIL_LOG_RESET_LINK:false}
