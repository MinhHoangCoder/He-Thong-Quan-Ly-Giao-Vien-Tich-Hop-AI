spring:
  application:
    name: tsdms

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=TSDMS;encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      # Flyway quản lý schema -> Hibernate không tự tạo/sửa bảng
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Gửi email (luồng quên mật khẩu). Điền tài khoản Gmail + App Password qua biến môi trường.
  # Tạo App Password: Google Account -> Security -> 2-Step Verification -> App passwords.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ===== Cấu hình riêng của TSDMS (bind qua @ConfigurationProperties) =====
tsdms:
  jwt:
    # QUAN TRỌNG: đổi secret ở môi trường thật. Tối thiểu 32 byte cho HS256.
    secret: ${JWT_SECRET:tsdms-dev-secret-change-me-please-at-least-32-bytes-long-0123456789}
    access-token-ttl: 15m      # access token sống ngắn
    refresh-token-ttl: 7d      # refresh token sống dài, lưu hash ở DB để thu hồi được
    issuer: tsdms
  reset:
    token-ttl: 30m             # link đặt lại mật khẩu hết hạn sau 30 phút
    base-url: ${APP_BASE_URL:http://localhost:5173}   # FE base url để ghép link reset
  mail:
    from: ${MAIL_FROM:no-reply@tsdms.local}
